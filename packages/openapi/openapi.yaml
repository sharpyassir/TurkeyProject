openapi: 3.1.0
info:
  title: pgcloud API
  version: "1"
  description: |
    The pgcloud public API. The same API powers the console, CLI, Terraform provider,
    SDKs and AI agents (via MCP in phase 2).

    **Conventions**
    - Base URL: `https://api.pgcloud.example/v1` (domain is an open decision)
    - Auth: `Authorization: Bearer pgc_…` (API token) or a console session JWT
    - Lists are cursor-paginated: `?limit=50&cursor=<id>` → `meta.next_cursor`
    - Mutations accept `Idempotency-Key` (replayed for 24h; same key + different body → 409)
    - Long operations return `202 Accepted` and a resource in a transitional status; poll or use webhooks
    - Money is integer minor units (`amountMinor`) with an explicit `currency` (`USD` | `TRY`)
    - Errors: `{ "error": { "code", "message", "details?" } }`
    - Rate limits: 600 requests per minute per token or session, 120 per minute per IP when anonymous,
      10 sign in attempts per minute per IP. Over the limit: `429 rate_limited` with `Retry-After`
servers:
  - url: http://localhost:4000/v1
    description: local development
security:
  - bearerAuth: []

tags:
  - name: auth
  - name: account
  - name: approvals
  - name: monitoring
  - name: servers
  - name: catalog
  - name: deploys
  - name: github
  - name: network
  - name: snapshots
  - name: marketplace
  - name: billing
  - name: webhooks

paths:
  /auth/signup:
    post:
      tags: [auth]
      security: []
      summary: Create a user, team and default project
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Signup" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Log in and receive a session token
      description: |
        When the user has two factor sign in, the first call answers 401 `totp_required`; repeat it with `totp`
        set to the six digit authenticator code or an unused recovery code. Team owners must enable two factor
        when `REQUIRE_TOTP_FOR_OWNERS` is on; until then console sessions get 403 `totp_setup_required` on every
        route except the account and two factor endpoints. API tokens are exempt.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string }, totp: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/verify:
    post:
      tags: [auth]
      security: []
      summary: Confirm an email address with the token from the verification email
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { verified: { type: boolean } } } } } }
        "400": { description: Token invalid or expired (`token_invalid`) }
  /auth/verify/request:
    post:
      tags: [auth]
      summary: Send the verification email again for the signed in user
      responses: { "204": { description: Sent (or already verified) } }
  /auth/password/forgot:
    post:
      tags: [auth]
      security: []
      summary: Send a password reset link
      description: Always returns 204 so email addresses cannot be probed. Limited to 5 requests per 10 minutes per IP.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } } }
      responses: { "204": { description: Accepted } }
  /auth/password/reset:
    post:
      tags: [auth]
      security: []
      summary: Set a new password with the token from the reset email
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 10 } } } } } }
      responses:
        "200": { description: OK }
        "400": { description: Token invalid or expired (`token_invalid`) }
  /auth/totp/setup:
    post:
      tags: [auth]
      summary: Start two factor enrollment
      description: Returns a new secret and an `otpauth://` URL to show as a QR code. Nothing is enforced until `/auth/totp/enable` confirms a code.
      responses:
        "201": { description: OK, content: { application/json: { schema: { type: object, properties: { secret: { type: string }, otpauthUrl: { type: string } } } } } }
        "409": { description: Already enabled (`totp_enabled`) }
  /auth/totp/enable:
    post:
      tags: [auth]
      summary: Confirm the authenticator and turn two factor on
      description: Returns ten recovery codes exactly once. Each recovery code signs the user in a single time.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TotpCode" } } } }
      responses:
        "201": { description: OK, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, recoveryCodes: { type: array, items: { type: string } } } } } } }
        "401": { description: Code not valid (`totp_invalid`) }
  /auth/totp/disable:
    post:
      tags: [auth]
      summary: Turn two factor off (needs a current code or a recovery code)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TotpCode" } } } }
      responses:
        "201": { description: OK }
        "401": { description: Code not valid (`totp_invalid`) }

  /account:
    get:
      tags: [account]
      summary: Current user, team, role and scopes
      responses:
        "200": { description: OK }
  /projects:
    get: { tags: [account], summary: List projects, responses: { "200": { description: OK } } }
    post:
      tags: [account]
      summary: Create a project
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, slug], properties: { name: { type: string }, slug: { type: string, pattern: "^[a-z0-9-]{2,40}$" }, spendLimitMinor: { type: integer } } } } } }
      responses: { "201": { description: Created } }
  /tokens:
    get: { tags: [account], summary: List API tokens, responses: { "200": { description: OK } } }
    post:
      tags: [account]
      summary: Create an API token (human or AI agent)
      description: |
        Agent-safe tokens set `isAgent: true` and may carry `spendCapMinor` (monthly hard cap)
        and `requireApprovalFor` (e.g. `["servers:delete","servers:resize-down"]`). A token can
        never carry scopes its creator does not have.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateToken" } } } }
      responses:
        "201": { description: "Created — `token` is shown once", content: { application/json: { schema: { type: object, properties: { id: { type: string }, token: { type: string }, prefix: { type: string } } } } } }
  /tokens/{id}:
    delete: { tags: [account], summary: Revoke a token, parameters: [{ $ref: "#/components/parameters/id" }], responses: { "204": { description: Revoked } } }
  /audit:
    get: { tags: [account], summary: Team audit log (newest 200 entries), responses: { "200": { description: OK } } }
  /interest:
    post:
      tags: [account]
      summary: Register interest in a roadmap product ("notify me when this launches")
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [product], properties: { product: { type: string, example: inference }, note: { type: string } } } } } }
      responses: { "204": { description: Recorded } }
  /ssh-keys:
    get: { tags: [account], summary: List SSH keys, responses: { "200": { description: OK } } }
    post:
      tags: [account]
      summary: Add an SSH public key
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, publicKey], properties: { name: { type: string }, publicKey: { type: string } } } } } }
      responses: { "201": { description: Created } }
  /ssh-keys/{id}:
    delete: { tags: [account], summary: Delete an SSH key, parameters: [{ $ref: "#/components/parameters/id" }], responses: { "204": { description: Deleted } } }

  /regions:
    get: { tags: [catalog], security: [], summary: List regions, responses: { "200": { description: OK } } }
  /sizes:
    get: { tags: [catalog], security: [], summary: List server sizes, responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Size" } } } } } } } } }
  /images:
    get:
      tags: [catalog]
      security: []
      summary: List images
      parameters: [{ name: kind, in: query, schema: { type: string, enum: [distribution, marketplace] } }]
      responses: { "200": { description: OK } }
  /billing/topup:
    post:
      tags: [billing]
      summary: Start a card payment that becomes prepaid credit
      description: Returns the hosted payment page (Stripe for USD teams, iyzico for TRY teams) to send the person to. Agents cannot call this.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amountMinor], properties: { amountMinor: { type: integer, description: "USD 5 to 5000, TRY 200 to 200000" } } } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Checkout" } } } }
  /billing/invoices/{id}/pay:
    post:
      tags: [billing]
      summary: Pay an open invoice by card
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Checkout" } } } }
        "409": { description: Invoice is not open (`invalid_state`) }
  /billing/invoices/{id}/pdf:
    get:
      tags: [billing]
      summary: Invoice as PDF
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: PDF, content: { application/pdf: { schema: { type: string, format: binary } } } } }
  /billing/payments:
    get: { tags: [billing], summary: Card payments of the team, responses: { "200": { description: OK } } }
  /billing/payments/stripe/webhook:
    post: { tags: [billing], security: [], summary: Stripe webhook (checkout.session events, verified with Stripe-Signature), responses: { "200": { description: OK } } }
  /billing/payments/iyzico/callback:
    post: { tags: [billing], security: [], summary: iyzico callback after the hosted page (result verified by retrieving the payment), responses: { "302": { description: Redirect to the console } } }
  /pricing:
    get:
      tags: [catalog]
      security: []
      summary: Public price list (USD base; TRY converted at the current exchange rate)
      parameters: [{ name: currency, in: query, schema: { type: string, enum: [USD, TRY], default: USD } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: { type: string }
                  baseCurrency: { type: string, enum: [USD] }
                  fxRate: { type: number, description: USD to currency rate used for this response }
                  hoursPerMonth: { type: integer }
                  data: { type: array, items: { type: object, properties: { resourceType: { type: string }, sku: { type: string }, unit: { type: string }, monthlyMinor: { type: integer }, hourlyMinor: { type: integer }, size: { $ref: "#/components/schemas/Size" } } } }

  /servers:
    get:
      tags: [servers]
      summary: List servers
      parameters:
        - { $ref: "#/components/parameters/project" }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/cursor" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ServerStatus" } }
        - { name: tag, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Server" } }, meta: { $ref: "#/components/schemas/PageMeta" } } } } } }
    post:
      tags: [servers]
      summary: Create a server
      description: |
        Returns `202` immediately with `status: new`. A durable workflow places the server,
        reserves a public IP, clones the image, waits for cloud-init, applies the firewall and
        starts metering. Watch `status` become `active` (30–60 s) or subscribe to `server.active`.
        The server is never billed unless it reaches `active`.
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateServer" } } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        "402": { description: Spend limit reached (`spend_limit_reached`) }
        "403": { description: Quota exceeded (`quota_exceeded`), account not verified (`verification_required`) or suspended }
        "422": { $ref: "#/components/responses/Invalid" }
  /servers/{id}:
    get:
      tags: [servers]
      summary: Get a server
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Server" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [servers]
      summary: Delete a server
      description: Returns `202`; the server moves to `deleting` and is removed by a workflow. Metering stops immediately.
      parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/idempotencyKey" }]
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/ServerAction" } } } }
        "409": { description: Invalid state (`invalid_state`) }
  /servers/{id}/actions:
    get:
      tags: [servers]
      summary: List recent actions on a server
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { description: OK } }
    post:
      tags: [servers]
      summary: Run a lifecycle action
      parameters: [{ $ref: "#/components/parameters/id" }, { $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [start, stop, reboot, resize, rebuild, snapshot] }
                size: { type: string, description: "resize: target size id (disk cannot shrink)" }
                image: { type: string, description: "rebuild: image id (defaults to current)" }
                name: { type: string, description: "snapshot: name" }
                force: { type: boolean, description: "stop: power off without ACPI shutdown" }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/ServerAction" } } } }
        "409": { description: Invalid state (`invalid_state`) }

  /deploys:
    get: { tags: [deploys], summary: List Git deployments, parameters: [{ $ref: "#/components/parameters/project" }], responses: { "200": { description: OK } } }
    post:
      tags: [deploys]
      summary: Deploy a Git repository onto a new server
      description: |
        Creates a server whose cloud-init installs Docker, clones the repo, builds (Dockerfile or docker-compose) and serves it on :80.
        Two ways to name the repository: `repoUrl` (public, or private with `gitToken`) returns a per deployment GitHub webhook URL and
        secret (shown once) to add to the repository; `installationId` + `repo` ("owner/name") uses the team's GitHub App installation,
        needs no token, and redeploys on every push through the app webhook (`webhook` is null).
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { repoUrl: { type: string, format: uri }, installationId: { type: string }, repo: { type: string, example: acme/app }, branch: { type: string, default: main }, name: { type: string }, port: { type: integer, default: 3000 }, size: { type: string }, project: { type: string }, sshKeys: { type: array, items: { type: string } }, env: { type: object, additionalProperties: { type: string } }, gitToken: { type: string, description: For private repos; stored only in the server's cloud-init } } } } } }
      responses: { "202": { description: Accepted; includes `webhook` (url and secret) for URL based deployments, null for app based ones } }
  /deploys/{id}:
    get: { tags: [deploys], summary: Get a deployment (refreshes status from the server), parameters: [{ $ref: "#/components/parameters/id" }], responses: { "200": { description: OK } } }
  /deploys/{id}/redeploy:
    post: { tags: [deploys], summary: Redeploy now, parameters: [{ $ref: "#/components/parameters/id" }], responses: { "202": { description: Accepted } } }
  /deploys/{id}/hook:
    post:
      tags: [deploys]
      security: []
      summary: GitHub push webhook (verified with X-Hub-Signature-256)
      parameters: [{ $ref: "#/components/parameters/id" }, { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }, { name: X-GitHub-Event, in: header, schema: { type: string } }]
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /approvals:
    get:
      tags: [approvals]
      summary: List approval requests (agents see only their own)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, denied, expired, failed] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/Approval" } }, pending: { type: integer } } } } } }
  /approvals/{id}:
    get:
      tags: [approvals]
      summary: Get one approval request
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /approvals/{id}/approve:
    post:
      tags: [approvals]
      summary: Approve and run the parked request
      description: Team owners and admins only, never an agent token. The request runs with the agent token's project scope and spending cap still applied; the audit log records both the person and the token.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: Ran, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Already decided or expired (`invalid_state`) }
  /approvals/{id}/deny:
    post:
      tags: [approvals]
      summary: Deny the parked request
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses:
        "201": { description: Denied, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
  /deploys/{id}/logs:
    get:
      tags: [deploys]
      summary: Tail of the last build log
      description: Fetched live from the server when it is reachable, otherwise the last cached copy. Capped at 32 KB.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { id: { type: string }, status: { type: string }, commit: { type: string, nullable: true }, log: { type: string }, updatedAt: { type: string, format: date-time, nullable: true }, live: { type: boolean, description: true when read from the server just now } } } } } }
  /github/app:
    get: { tags: [github], summary: Whether the GitHub App integration is configured, responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean } } } } } } } }
  /github/connect:
    get:
      tags: [github]
      summary: URL to install the GitHub App for this team
      description: Send the user there. GitHub returns them to the console callback with installation_id and the signed state, which the console posts to /github/installations.
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { url: { type: string } } } } } }, "503": { description: Not configured (`github_app_unavailable`) } }
  /github/installations:
    get: { tags: [github], summary: GitHub App installations linked to the team, responses: { "200": { description: OK } } }
    post:
      tags: [github]
      summary: Link an installation after the GitHub redirect
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [installationId, state], properties: { installationId: { type: integer }, state: { type: string } } } } } }
      responses: { "201": { description: Linked }, "401": { description: State invalid or expired } }
  /github/installations/{id}:
    delete: { tags: [github], summary: Unlink and uninstall, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: Removed } } }
  /github/installations/{id}/repos:
    get: { tags: [github], summary: Repositories the installation can reach, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK } } }
  /github/webhook:
    post:
      tags: [github]
      security: []
      summary: GitHub App webhook (push, installation)
      description: One URL for every installation, verified with X-Hub-Signature-256 and the app webhook secret. A push redeploys every deployment on that repository and branch.
      responses: { "200": { description: OK } }
  /servers/{id}/metrics:
    get:
      tags: [monitoring]
      summary: Time series for a server
      description: One point per minute for 1h, 6h and 24h; hourly averages (with the hour's CPU peak) for 7d and 30d. Network and disk are bytes per second; multiply by 8 and divide by a million for Mbps.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: period, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 1h } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MetricSeries" } } } }
  /alerts:
    get: { tags: [monitoring], summary: List alert rules, responses: { "200": { description: OK } } }
    post:
      tags: [monitoring]
      summary: Create an alert rule
      description: Fires when the metric, averaged over windowMinutes, is above or below the threshold on any matching server. Empty serverIds and tags means every server in the team. Owners and admins are emailed, plus any addresses in emails; webhooks get alert.triggered and alert.resolved.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AlertRuleInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AlertRule" } } } } }
  /alerts/incidents:
    get:
      tags: [monitoring]
      summary: Incidents (open and recent)
      parameters: [{ name: open, in: query, schema: { type: boolean } }]
      responses: { "200": { description: OK } }
  /alerts/{id}:
    get: { tags: [monitoring], summary: Get an alert rule with recent incidents, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } } }
    patch:
      tags: [monitoring]
      summary: Update an alert rule (any field, including enabled to mute)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AlertRuleInput" } } } }
      responses: { "200": { description: OK } }
    delete: { tags: [monitoring], summary: Delete an alert rule, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { "204": { description: Deleted } } }
  /firewalls:
    get: { tags: [network], summary: List firewalls, parameters: [{ $ref: "#/components/parameters/project" }], responses: { "200": { description: OK } } }
    post:
      tags: [network]
      summary: Create a firewall
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, rules], properties: { name: { type: string }, project: { type: string }, rules: { type: array, items: { $ref: "#/components/schemas/FirewallRule" } } } } } } }
      responses: { "201": { description: Created } }
  /firewalls/{id}:
    get: { tags: [network], summary: Get a firewall, parameters: [{ $ref: "#/components/parameters/id" }], responses: { "200": { description: OK } } }
    delete: { tags: [network], summary: Delete a firewall, parameters: [{ $ref: "#/components/parameters/id" }], responses: { "204": { description: Deleted } } }
  /firewalls/{id}/rules:
    put:
      tags: [network]
      summary: Replace all rules (re-applied to attached servers immediately)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [rules], properties: { rules: { type: array, items: { $ref: "#/components/schemas/FirewallRule" } } } } } } }
      responses: { "200": { description: OK } }
  /firewalls/{id}/servers:
    post:
      tags: [network]
      summary: Attach a server
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [serverId], properties: { serverId: { type: string } } } } } }
      responses: { "204": { description: Attached } }
  /firewalls/{id}/servers/{serverId}:
    delete: { tags: [network], summary: Detach a server, parameters: [{ $ref: "#/components/parameters/id" }, { name: serverId, in: path, required: true, schema: { type: string } }], responses: { "204": { description: Detached } } }
  /public-ips:
    get: { tags: [network], summary: List public IPs in a project, parameters: [{ $ref: "#/components/parameters/project" }], responses: { "200": { description: OK } } }

  /snapshots:
    get: { tags: [snapshots], summary: List snapshots, parameters: [{ $ref: "#/components/parameters/project" }], responses: { "200": { description: OK } } }
  /snapshots/{id}:
    delete: { tags: [snapshots], summary: Delete a snapshot, parameters: [{ $ref: "#/components/parameters/id" }], responses: { "202": { description: Accepted } } }

  /apps:
    get: { tags: [marketplace], security: [], summary: List marketplace apps, parameters: [{ name: category, in: query, schema: { type: string } }], responses: { "200": { description: OK } } }
  /apps/categories:
    get: { tags: [marketplace], security: [], summary: App categories with counts, responses: { "200": { description: OK } } }
  /apps/{slug}:
    get:
      tags: [marketplace]
      security: []
      summary: Get an app (its `variables` describe the one-click form)
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } }

  /billing/balance:
    get: { tags: [billing], summary: Credit balance, month-to-date spend and account status, responses: { "200": { description: OK } } }
  /billing/usage:
    get:
      tags: [billing]
      summary: Rated usage per resource
      parameters: [{ $ref: "#/components/parameters/project" }, { name: from, in: query, schema: { type: string, format: date-time } }, { name: to, in: query, schema: { type: string, format: date-time } }]
      responses: { "200": { description: OK } }
  /billing/invoices:
    get: { tags: [billing], summary: List invoices, responses: { "200": { description: OK } } }
  /billing/invoices/{id}:
    get: { tags: [billing], summary: Get an invoice with its usage lines, parameters: [{ $ref: "#/components/parameters/id" }], responses: { "200": { description: OK } } }

  /webhooks:
    get: { tags: [webhooks], summary: List webhooks, responses: { "200": { description: OK } } }
    post:
      tags: [webhooks]
      summary: Create a webhook
      description: "Deliveries are signed with `X-Pgcloud-Signature: sha256=<hmac>` using the secret returned once at creation."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url, events], properties: { url: { type: string, format: uri }, events: { type: array, items: { $ref: "#/components/schemas/EventName" } } } } } } }
      responses: { "201": { description: Created } }
  /webhooks/events:
    get: { tags: [webhooks], summary: List subscribable event names, responses: { "200": { description: OK } } }
  /webhooks/{id}:
    delete: { tags: [webhooks], summary: Delete a webhook, parameters: [{ $ref: "#/components/parameters/id" }], responses: { "204": { description: Deleted } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string } }
    project: { name: project, in: query, description: Project id or slug (default `default`), schema: { type: string } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    cursor: { name: cursor, in: query, schema: { type: string } }
    idempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string, format: uuid } }
  responses:
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Forbidden, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict: { description: Conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Invalid: { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, unauthorized, forbidden, approval_required, not_found, conflict, invalid_state, quota_exceeded, spend_limit_reached, verification_required, account_suspended, idempotency_key_reused, rate_limited, workflow_unavailable, internal_error]
            message: { type: string }
            details: { type: object, additionalProperties: true }
    PageMeta:
      type: object
      properties: { next_cursor: { type: [string, "null"] }, count: { type: integer } }
    Approval:
      type: object
      description: A request from an agent token that a person must approve before it runs.
      properties:
        id: { type: string }
        kind: { type: string, example: "servers:delete" }
        summary: { type: string, example: "Delete server web-1 (s-2vcpu-4gb)" }
        status: { type: string, enum: [pending, approved, denied, expired, failed] }
        resourceType: { type: string }
        resourceId: { type: string, nullable: true }
        resourceName: { type: string, nullable: true }
        payload: { type: object, description: The original request body }
        result: { type: object, nullable: true, description: What the action returned once approved }
        reason: { type: string, nullable: true }
        token: { type: object, nullable: true, properties: { name: { type: string }, prefix: { type: string } } }
        decidedBy: { type: object, nullable: true, properties: { name: { type: string }, email: { type: string } } }
        decidedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    Checkout:
      type: object
      properties:
        paymentId: { type: string }
        provider: { type: string, enum: [stripe, iyzico, fake] }
        amountMinor: { type: integer }
        currency: { type: string, enum: [USD, TRY] }
        redirectUrl: { type: string, description: Hosted payment page }
    MetricPoint:
      type: object
      properties:
        at: { type: string, format: date-time }
        cpu: { type: number, description: percent }
        cpuMax: { type: number, description: peak within the hour (hourly resolution only) }
        memoryUsedMb: { type: integer }
        memoryTotalMb: { type: integer }
        netInBps: { type: number }
        netOutBps: { type: number }
        diskReadBps: { type: number }
        diskWriteBps: { type: number }
        diskUsedPercent: { type: number, nullable: true }
    MetricSeries:
      type: object
      properties:
        serverId: { type: string }
        period: { type: string }
        resolution: { type: string, enum: [minute, hour] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        latest: { $ref: "#/components/schemas/MetricPoint" }
        points: { type: array, items: { $ref: "#/components/schemas/MetricPoint" } }
    AlertRuleInput:
      type: object
      properties:
        name: { type: string }
        metric: { type: string, enum: [cpu, memory, disk, net_in, net_out] }
        comparator: { type: string, enum: [above, below], default: above }
        threshold: { type: number, description: percent for cpu, memory and disk; Mbps for network }
        windowMinutes: { type: integer, default: 5 }
        serverIds: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        emails: { type: array, items: { type: string, format: email } }
        enabled: { type: boolean }
    AlertRule:
      allOf:
        - $ref: "#/components/schemas/AlertRuleInput"
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, description: Six digit authenticator code, or a recovery code }
    Signup:
      type: object
      required: [email, password, name, teamName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        name: { type: string }
        teamName: { type: string }
        country: { type: string, default: TR }
        locale: { type: string, enum: [en, tr, ar] }
    Session:
      type: object
      properties:
        user: { type: object }
        team: { type: object }
        session: { type: string, description: JWT to use as Bearer token }
    CreateToken:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
        projectId: { type: string }
        isAgent: { type: boolean }
        spendCapMinor: { type: integer }
        requireApprovalFor: { type: array, items: { type: string }, example: ["servers:delete", "servers:resize-down"] }
        expiresInDays: { type: integer }
    Scope:
      type: string
      enum: [servers:read, servers:write, servers:delete, images:read, snapshots:read, snapshots:write, network:read, network:write, apps:read, billing:read, billing:write, iam:read, iam:write]
    Size:
      type: object
      properties:
        id: { type: string, example: s-2vcpu-4gb }
        vcpu: { type: integer }
        memoryMb: { type: integer }
        diskGb: { type: integer }
        transferTb: { type: number }
        family: { type: string, enum: [shared, dedicated, gpu] }
    ServerStatus:
      type: string
      enum: [new, provisioning, active, off, rebooting, resizing, rebuilding, deleting, deleted, failed, suspended]
    CreateServer:
      type: object
      required: [name, size, image]
      properties:
        name: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
        size: { type: string, example: s-2vcpu-4gb }
        image: { type: string, description: Image id or marketplace app slug, example: ubuntu-24-04 }
        region: { type: string, default: ist1 }
        project: { type: string, default: default }
        sshKeys: { type: array, items: { type: string } }
        userData: { type: string, description: cloud-init user-data }
        tags: { type: array, items: { type: string } }
        backups: { type: boolean }
        firewalls: { type: array, items: { type: string } }
        appVariables: { type: object, additionalProperties: { type: string }, description: Marketplace app variables }
        avoid: { type: array, items: { type: string }, description: Server ids to anti-affine from }
    Server:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/ServerStatus" }
        statusMessage: { type: [string, "null"] }
        region: { type: object, properties: { id: { type: string }, name: { type: string } } }
        size: { $ref: "#/components/schemas/Size" }
        image: { type: object }
        networks:
          type: object
          properties:
            v4: { type: array, items: { type: object, properties: { ipAddress: { type: string }, type: { type: string }, floating: { type: boolean } } } }
            private: { type: array, items: { type: object, properties: { ipAddress: { type: string } } } }
        firewalls: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        backupsEnabled: { type: boolean }
        projectId: { type: string }
        createdAt: { type: string, format: date-time }
    ServerAction:
      type: object
      properties:
        id: { type: string }
        serverId: { type: string }
        type: { type: string, enum: [create, start, stop, reboot, resize, rebuild, snapshot, delete] }
        status: { type: string, enum: [queued, running, completed, failed] }
        error: { type: [string, "null"] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    FirewallRule:
      type: object
      required: [direction, protocol, cidrs]
      properties:
        direction: { type: string, enum: [inbound, outbound] }
        protocol: { type: string, enum: [tcp, udp, icmp, any] }
        ports: { type: string, example: "80-443" }
        cidrs: { type: array, items: { type: string }, example: ["0.0.0.0/0"] }
        description: { type: string }
    EventName:
      type: string
      enum: [server.created, server.active, server.failed, server.deleted, server.resized, snapshot.completed, invoice.issued, invoice.paid, payment.failed, spend.alert, spend.limit_reached, account.suspended]

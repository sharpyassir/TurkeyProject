name: deploy

# Every push to main builds the three control plane images and tags them with the commit sha
# (and `latest`). A tag `v*` also tags them with the version. The deploy job then rolls the
# management host over SSH, which pulls the images, runs migrations and restarts.
#
# Secrets (repository settings):
#   DEPLOY_HOST   management host address        DEPLOY_USER  ssh user (the Ansible user)
#   DEPLOY_SSH_KEY  private key for that user    NEXT_PUBLIC_API_URL  https://api.<domain>
# Set the `production` environment to require a reviewer if you want a manual gate.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md", "cli/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, console, www]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/pgcloud-${{ matrix.app }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    if: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Roll the management host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: sudo /opt/pgcloud/deploy.sh ${{ github.ref_type == 'tag' && github.ref_name || format('{0}', github.sha) }}
